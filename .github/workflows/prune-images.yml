name: Prune Old GHCR Docker Images

on:
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      min_images_to_keep:
        description: 'Number of newest image builds to keep'
        required: true
        default: '5'
        type: string
      dry_run:
        description: 'Log what would be deleted without deleting'
        required: true
        default: false
        type: boolean
      debug:
        description: 'Print the raw version listing (for troubleshooting grouping)'
        required: true
        default: false
        type: boolean

jobs:
  prune-images:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prune old container images from GHCR
        # Keeps the newest N *builds* rather than the newest N package versions;
        # see .github/scripts/prune-ghcr.sh for why that distinction matters.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
          MIN_IMAGES_TO_KEEP: ${{ inputs.min_images_to_keep || '5' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          DEBUG: ${{ inputs.debug && '1' || '0' }}
        run: bash .github/scripts/prune-ghcr.sh
