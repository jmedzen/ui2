name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # Read from .nvmrc so CI and the Docker build cannot drift apart.
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Verify toolchain versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Run Full-Site Automated Test Suite
        run: npm run test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_VERSION=24.17.0

      - name: Prune old container images from GHCR (keep latest 5)
        # Uses the runner's built-in `gh` instead of actions/delete-package-versions,
        # which is still published only for the Node 20 runtime and therefore made
        # every run emit a "Node.js 20 is deprecated" annotation.
        #
        # Non-fatal by design: pruning is housekeeping, and a registry hiccup must
        # not fail a build whose image has already been pushed successfully.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ui2
          MIN_VERSIONS_TO_KEEP: '5'
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY%%/*}"
          versions_url="users/${owner}/packages/container/${PACKAGE_NAME}/versions"

          # Paginate over every published version (the API caps pages at 100).
          gh api --paginate "${versions_url}?per_page=100" \
            --jq '.[] | [.id, .created_at] | @tsv' > versions.tsv || {
              echo "::warning::Could not list package versions; skipping prune."
              exit 0
            }

          total=$(grep -c . versions.tsv || true)
          echo "Found ${total} published version(s); keeping the newest ${MIN_VERSIONS_TO_KEEP}."

          # Oldest first: ISO-8601 UTC timestamps sort correctly as plain strings.
          sort -k2,2 versions.tsv > sorted.tsv
          to_delete=$(( total - MIN_VERSIONS_TO_KEEP ))
          if [ "${to_delete}" -le 0 ]; then
            echo "Nothing to prune."
            exit 0
          fi

          head -n "${to_delete}" sorted.tsv | while IFS=$'\t' read -r id created; do
            echo "Deleting version ${id} (created ${created})."
            gh api --method DELETE "${versions_url}/${id}" \
              || echo "::warning::Failed to delete version ${id}; continuing."
          done

