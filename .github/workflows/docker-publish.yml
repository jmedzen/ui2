name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # Read from .nvmrc so CI and the Docker build cannot drift apart.
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Verify toolchain versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Run Full-Site Automated Test Suite
        run: npm run test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_VERSION=24.17.0

      - name: Prune old container images from GHCR (keep latest 5)
        # NOTE: this action is still published for the Node 20 runtime and has no
        # Node 24 release yet, so it emits a deprecation warning. It is marked
        # continue-on-error so a future runtime removal cannot fail the build.
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: 'ui2'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: 'false'

