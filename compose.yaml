# Docker Compose Configuration
# Usage: docker compose up -d

name: fyui2

services:
  ui2:
    image: ghcr.io/jmedzen/ui2:latest
    container_name: ui2
    restart: always
    ports:
      - "8410:8410"
    environment:
      - NODE_ENV=production
      - PORT=8410
      - HOSTNAME=0.0.0.0
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8410/api/courses"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

