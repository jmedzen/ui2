# Docker Compose Configuration
# Usage: docker compose up -d

name: ui2

services:
  ui2:
    image: ghcr.io/jmedzen/ui2:latest
    container_name: ui2
    restart: always
    # NOTE: no `user:` here on purpose.
    #
    # ./data is a bind mount, so its ownership comes from the host and is not
    # something the image can fix at build time. The container previously forced
    # `user: "node"` (uid 1000); when the host directory was owned by a different
    # uid, the app could not create data/logs/scan.lock and every maintenance
    # trigger failed with "A scan or repair task is already running".
    #
    # The entrypoint now starts as root, aligns ownership of the data directory,
    # and immediately re-execs the app as "node" via su-exec. The application
    # process itself never has root, and drops all capabilities on setuid.
    #
    # Least privilege: no new privileges can be gained. Capabilities are dropped
    # wholesale and only the four the ownership fix-up genuinely needs are
    # restored; none of them survive the drop to the unprivileged user.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN # reassign ./data to the app uid
      - DAC_OVERRIDE # create data/logs inside a mount owned by another uid
      - SETUID # su-exec: drop to "node"
      - SETGID # su-exec: adopt the "node" group
    ports:
      # Bind to loopback only. Publishing 0.0.0.0:8410 let clients reach the
      # app directly and bypass Caddy, which is what made X-Forwarded-For
      # spoofable and the preload rate limit escapable. A host-installed Caddy
      # reaches the service through this loopback port; a Caddy container can
      # use the compose network instead.
      - "127.0.0.1:8410:8410"
    environment:
      - NODE_ENV=production
      - PORT=8410
      - HOSTNAME=0.0.0.0
      - MEDIA_CACHE_MAX_BYTES=21474836480 # 20 GB Disk Cache Limit
      - MEDIA_CACHE_MAX_CONCURRENCY=3 # Cap simultaneous background downloads
      - PROXY_PRELOAD_MAX_PER_MINUTE=20 # Per-client preload budget
      # Trust X-Forwarded-For / X-Forwarded-Proto. The published port is bound
      # to loopback and every external request goes through Caddy, which
      # overwrites these headers. Without this, admin login sees the upstream
      # HTTP hop and (correctly) refuses to accept a password in production.
      - TRUST_PROXY=1
      # Optional automation credential for cron/CI. Human admin actions use the
      # password file in ./data/admin.json; this token is never entered in the
      # browser UI.
      # - TASK_API_TOKEN=change-me
      # Optional admin tuning:
      # - ADMIN_SESSION_TTL_MINUTES=720
      # - ADMIN_ALLOWED_ORIGINS=https://your.domain.example
      # - ADMIN_ALLOW_INSECURE_HTTP=1  # only for a trusted, isolated LAN
      # Audit rotation (defaults: 1 MB, five numbered backups):
      # - ADMIN_AUDIT_MAX_BYTES=1048576
      # - ADMIN_AUDIT_MAX_FILES=5
      # Optional fixed TOTP secret. When set it overrides ./data/admin.json
      # and the web UI cannot manage TOTP; prefer the UI or a Docker secret.
      # - ADMIN_TOTP_SECRET=CHANGE_ME_BASE32
      # Account the password CLI hands ./data/admin.json to when it runs as
      # root. There is no `user:` above and the image has no USER node, so
      # `docker compose exec` gives you a root shell; the CLI then chowns the
      # 0600 credential to this account so the unprivileged app can read it.
      # Defaults to the image's "node" user (uid 1000). Override only if your
      # setup runs the app as a different uid.
      # - ADMIN_FILE_OWNER=1000:1000
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8410/api/courses"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

